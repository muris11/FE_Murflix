<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#99060e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="160" height="160" rx="32" fill="url(#bgRed)" />
  <!-- Inner Highlight -->
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />
  <!-- Face Features -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Eyes -->
    <rect x="44" y="52" width="16" height="26" rx="8" />
    <rect x="100" y="52" width="16" height="26" rx="8" />
    <!-- Smile -->
    <path d="M 46 98 C 60 122, 100 122, 114 98" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>

