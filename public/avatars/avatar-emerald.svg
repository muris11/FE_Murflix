<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgEmerald)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Chill Zen Face -->
  <g filter="url(#shadow)" fill="#ffffff">
    <ellipse cx="50" cy="64" rx="9" ry="12" />
    <ellipse cx="110" cy="64" rx="9" ry="12" />
    <!-- Chill Soft Smile -->
    <path d="M 48 98 C 64 116, 96 116, 112 98" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>

