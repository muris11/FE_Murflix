<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgYellow)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Cheerful Happy Face -->
  <g filter="url(#shadow)">
    <!-- Happy Arch Eyes -->
    <path d="M 40 68 C 44 48, 64 48, 68 68" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <path d="M 92 68 C 96 48, 116 48, 120 68" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <!-- Big Open Smile -->
    <path d="M 44 94 C 52 126, 108 126, 116 94 Z" fill="#ffffff" />
    <path d="M 58 108 C 66 120, 94 120, 102 108" fill="#f87171" />
  </g>
</svg>

