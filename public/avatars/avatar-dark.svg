<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgDark)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#52525b" stroke-width="1.5" stroke-opacity="0.3" />
  <!-- Stealth Mask Band -->
  <g filter="url(#shadow)">
    <!-- Mask Band -->
    <rect x="24" y="46" width="112" height="36" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <!-- Glowing Sharp Eyes -->
    <ellipse cx="54" cy="64" rx="10" ry="6" fill="#e4e4e7" />
    <ellipse cx="106" cy="64" rx="10" ry="6" fill="#e4e4e7" />
    <circle cx="56" cy="64" r="3.5" fill="#e50914" />
    <circle cx="104" cy="64" r="3.5" fill="#e50914" />
    <!-- Sleek Ninja Smirk -->
    <path d="M 60 108 L 100 108" stroke="#71717a" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>

