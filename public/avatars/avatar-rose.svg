<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgRose)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Winking Playful Face -->
  <g filter="url(#shadow)">
    <!-- Left Round Eye -->
    <rect x="42" y="52" width="18" height="24" rx="9" fill="#ffffff" />
    <!-- Right Winking Eye -->
    <path d="M 94 66 C 100 54, 116 54, 122 66" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" />
    <!-- Happy Smile with Tongue -->
    <path d="M 48 96 C 58 122, 102 122, 112 96" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>

