<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgPurple)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />
  <!-- Cyber / Visor Face -->
  <g filter="url(#shadow)">
    <!-- Neon Cyber Visor -->
    <rect x="34" y="52" width="92" height="26" rx="8" fill="#18181b" />
    <rect x="38" y="56" width="84" height="18" rx="5" fill="#a855f7" />
    <line x1="42" y1="65" x2="118" y2="65" stroke="#f0abfc" stroke-width="3" stroke-linecap="round" />
    <!-- Confident Smirk -->
    <path d="M 52 104 C 66 116, 94 116, 108 104" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>

