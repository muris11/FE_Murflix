<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#bgCrimson)" />
  <rect x="4" y="4" width="152" height="152" rx="28" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" />
  <!-- Confident Heroic Face -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Determined Eyebrows -->
    <path d="M 40 48 L 62 54" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 120 48 L 98 54" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Eyes -->
    <rect x="44" y="58" width="16" height="20" rx="8" />
    <rect x="100" y="58" width="16" height="20" rx="8" />
    <!-- Heroic Smirk -->
    <path d="M 52 102 C 68 120, 104 116, 112 98" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>

